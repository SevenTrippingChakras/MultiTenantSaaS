# Runs the containerized backend + frontend together.
# MongoDB stays on Atlas (managed), reached via the backend's .env connection string.
services:
  redis:
    image: redis:7
    container_name: chatprod-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URI: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    # Same image as the backend; runs the ARQ worker instead of the API. It runs
    # the periodic usage-aggregation cron (raw events are written by the API now).
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URI: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle; the browser calls the published backend port.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
